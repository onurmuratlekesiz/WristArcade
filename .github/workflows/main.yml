name: Build & Package WristArcade (IPA for Sideloadly)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Swift Package & Generate IPA
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Detect Project Directory & Clean Duplicates
      run: |
        if [ -d "WristArcade" ]; then
          echo "DIR=WristArcade" >> $GITHUB_ENV
          rm -rf WristArcade/Complications
        else
          echo "DIR=." >> $GITHUB_ENV
          rm -rf Complications
        fi

    - name: Show Xcode & Swift Version
      run: |
        xcodebuild -version
        swift --version

    - name: Install XcodeGen
      run: |
        which xcodegen || brew install xcodegen

    - name: Ensure project.yml exists
      run: |
        cat << 'EOF' > $DIR/project.yml
        name: WristArcade
        options:
          bundleIdPrefix: com.wristarcade
          deploymentTarget:
            iOS: "16.0"
            watchOS: "9.0"
        targets:
          WristArcade:
            type: application
            platform: iOS
            deploymentTarget: "16.0"
            sources:
              - path: Companion
            settings:
              PRODUCT_BUNDLE_IDENTIFIER: com.wristarcade.app
              INFOPLIST_FILE: Companion/Info.plist
              GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: YES
              SWIFT_VERSION: "5.9"
            dependencies:
              - target: WristArcadeWatch
                embed: true

          WristArcadeWatch:
            type: application
            platform: watchOS
            deploymentTarget: "9.0"
            sources:
              - path: Core
              - path: Games
              - path: Views
              - path: Widgets
              - path: Assets.xcassets
              - path: WristArcadeApp.swift
            settings:
              PRODUCT_BUNDLE_IDENTIFIER: com.wristarcade.app.watchkitapp
              INFOPLIST_FILE: Info.plist
              GENERATE_INFOPLIST_KEY_WKApplication: YES
              GENERATE_INFOPLIST_KEY_WKCompanionAppBundleIdentifier: YES
              SWIFT_VERSION: "5.9"
        EOF

    - name: Generate Xcode Project
      run: |
        cd $DIR
        xcodegen generate

    - name: Archive and Package IPA
      run: |
        cd $DIR
        xcodebuild archive \
          -project WristArcade.xcodeproj \
          -scheme WristArcade \
          -destination 'generic/platform=iOS' \
          -archivePath build/WristArcade.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO
        
        mkdir -p build/Payload
        echo "Searching for built iOS .app bundle..."
        APP_PATH=$(find build/WristArcade.xcarchive/Products -name "WristArcade.app" | head -n 1)
        if [ -z "$APP_PATH" ]; then
          APP_PATH=$(find build -name "WristArcade.app" | head -n 1)
        fi
        echo "Packaging iOS App found at: $APP_PATH"
        cp -r "$APP_PATH" build/Payload/
        cd build
        zip -r WristArcade.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WristArcade-IPA
        path: |
          WristArcade/build/WristArcade.ipa
          build/WristArcade.ipa
        retention-days: 14
